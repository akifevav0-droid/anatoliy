    super(props);

    this.onMq = () => this.setState({ phone: this.mq.matches });

  componentDidMount() { this.mq.addEventListener('change', this.onMq); }

}

// Мягкая прокрутка: только компьютер с мышью и без «уменьшить движение»
(function () {
  var fine = window.matchMedia('(pointer: fine)').matches;
  var calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!window.Lenis || !fine || calm) return;
  var lenis = new Lenis({ lerp: 0.09, wheelMultiplier: 1, anchors: { offset: -80 }, syncTouch: false });
  function raf(t) { lenis.raf(t); requestAnimationFrame(raf); }
  requestAnimationFrame(raf);
  // сториз и меню блокируют прокрутку через overflow:hidden у html — останавливаем и Lenis
  new MutationObserver(function () {
    if (document.documentElement.style.overflow === 'hidden') lenis.stop(); else lenis.start();
  }).observe(document.documentElement, { attributes: true, attributeFilter: ['style'] });
})();
</script>
